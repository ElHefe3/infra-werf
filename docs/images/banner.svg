<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">InfraWerf</title>
  <desc id="d">The InfraWerf mark and the tagline "Your homelab, connected." beside a faint network of connected servers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d6a55"/>
      <stop offset="1" stop-color="#1b4234"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="280" rx="20" fill="url(#bg)"/>

  <!-- faint network motif -->
  <g stroke="#f5f3e8" stroke-opacity="0.18" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M720 210 L820 120 L930 170 L1040 80 L1130 150"/>
    <path d="M820 120 L880 50 L1040 80"/>
    <path d="M930 170 L990 235 L1130 150"/>
    <path d="M720 210 L790 250 L990 235"/>
  </g>
  <g fill="#f5f3e8" fill-opacity="0.30">
    <circle cx="720" cy="210" r="9"/><circle cx="820" cy="120" r="11"/>
    <circle cx="930" cy="170" r="9"/><circle cx="1040" cy="80" r="12"/>
    <circle cx="1130" cy="150" r="8"/><circle cx="880" cy="50" r="7"/>
    <circle cx="990" cy="235" r="8"/><circle cx="790" cy="250" r="6"/>
  </g>
  <g fill="#8fc7a8" fill-opacity="0.9">
    <circle cx="820" cy="120" r="4"/><circle cx="1040" cy="80" r="4"/><circle cx="930" cy="170" r="4"/>
  </g>

  <!-- mark -->
  <rect x="64" y="88" width="104" height="104" rx="30" fill="#f5f3e8"/>
  <path d="m89 118 11.5 38 14.5-26.5 14.5 26.5 11.5-38" transform="translate(-2.5 2)" fill="none" stroke="#255947" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="196" y="150" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="64" font-weight="650" letter-spacing="-2" fill="#f5f3e8">InfraWerf</text>
  <text x="199" y="190" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="24" fill="#c9d6cb">Your homelab, connected.</text>
</svg>
