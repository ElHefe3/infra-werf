[package]
name = "systemd-backups-job"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The Check backups job of the Systemd backups example plugin for InfraWerf."
publish = false

# Not part of InfraWerf's own workspace: a plugin is built on its own.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde_json = "=1.0.154"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
