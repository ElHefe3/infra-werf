# Exact releases resolved on 2026-10-25. Upgrade deliberately between batches.
[tools]
node = "26.12.1"
pnpm = "12.15.0"
python = "3.15.1"
java = "temurin-21.0.12+101.0.LTS"
rust = { version = "1.99.1-x86_64-pc-windows-msvc", profile = "default", targets = ["aarch64-linux-android"] }

[env]
ATLAS_ANDROID_NDK_VERSION = "27.1.12297006"

[tasks.doctor]
description = "Inspect effective runtimes and native build prerequisites"
run = "powershell -NoProfile -File scripts/atlas.ps1 doctor"

[tasks.deps]
description = "Install the committed JavaScript dependency lock"
run = "powershell -NoProfile -File scripts/atlas.ps1 deps"

[tasks."tracker:check"]
description = "Validate roadmap, dependencies and evidence rules"
run = "powershell -NoProfile -File scripts/atlas.ps1 tracker-check"

[tasks.check]
description = "Check frontend types and native Rust code without rewriting"
run = "powershell -NoProfile -File scripts/atlas.ps1 check"

[tasks."test:feature"]
description = "Run the selected feature's bounded checks"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-feature"

[tasks."test:integration"]
description = "Run Python/Rust parity, rollback, writer-lock and import checks on private synthetic copies"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-integration"

[tasks."dev:desktop"]
run = "powershell -NoProfile -File scripts/atlas.ps1 dev-desktop"

[tasks."start:desktop"]
description = "Open the installed primary InfraWerf release with its normal saved workspace"
run = "powershell -NoProfile -File scripts/atlas.ps1 start-desktop"

[tasks."test:desktop"]
description = "Actual Windows WebView2/Rust IPC save, restart and error proof on synthetic data (build first)"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-desktop"

[tasks."test:desktop:full"]
description = "Run all native desktop fixture journeys sequentially against an explicit release binary"
run = "powershell -NoProfile -File scripts/atlas.ps1 exec -- powershell -NoProfile -File scripts/verify_native_suite.ps1"

[tasks."ssh:fixture"]
description = "Prepare the pinned isolated loopback SSH test runtime; no services or real identities"
run = "powershell -NoProfile -File scripts/atlas.ps1 ssh-fixture"

[tasks."test:ssh"]
description = "Real OpenSSH strict-trust/auth/error proof against fixture-only loopback servers"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-ssh"

[tasks."test:ssh-native"]
description = "Actual native SSH Settings/cancel/close guard proof on fixture-only data (build first)"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-ssh-native"

[tasks."dev:android"]
run = "powershell -NoProfile -File scripts/atlas.ps1 dev-android"

[tasks."test:files"]
description = "Actual loopback SFTP session lifetime, handle revocation, timeout and cleanup proof"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-files"

[tasks."test:elevation"]
description = "Actual fresh sudo and host-pinned operation proof in a disposable local Linux container"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-elevation"

[tasks."test:elevation-native"]
description = "Actual native UI wrong-password, fresh sudo, cancellation and protected-session clearing proof"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-elevation-native"

[tasks."test:health-native"]
description = "Actual Windows Health tab loopback healthy/stale/failure UI journey"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-health-native"

[tasks."test:monitoring-native"]
description = "Native dynamic monitoring failure/recovery and server lifecycle on synthetic loopback data"
run = "powershell -NoProfile -File scripts/atlas.ps1 exec -- node scripts/verify_native_monitoring.mjs"

[tasks."test:apps-native"]
description = "Native remote application tunnels: isolated window, HTTP/WebSocket, teardown and refusals on loopback fixtures (build first)"
run = "powershell -NoProfile -File scripts/atlas.ps1 exec -- node scripts/verify_native_apps.mjs"

[tasks."test:inventory-native"]
description = "Actual Windows approved inventory refresh over disposable authenticated SSH"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-inventory-native"

[tasks."test:workloads-native"]
description = "Actual Windows protected workload inspection and bounded log proof on fixture-only SSH"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-workloads-native"

[tasks."test:files-native"]
description = "Actual native Files browse/stat/lock/error journey on isolated fixture data (build first)"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-files-native"

[tasks."test:file-changes-native"]
description = "Actual native confirmed create/rename/move/delete and cancellation/error proof in fixture-only write-area"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-file-changes-native"

[tasks."smoke:desktop"]
description = "Compile the thin Windows debug application without an installer"
run = "powershell -NoProfile -File scripts/atlas.ps1 smoke-desktop"

[tasks."smoke:android"]
description = "Compile the thin ARM64 Android debug APK"
run = "powershell -NoProfile -File scripts/atlas.ps1 smoke-android"

[tasks."build:desktop"]
description = "Build the Windows NSIS installer"
run = "powershell -NoProfile -File scripts/atlas.ps1 build-desktop"

[tasks."brand:icons"]
description = "Generate desktop icons from the InfraWerf SVG logo"
run = "powershell -NoProfile -File scripts/atlas.ps1 exec -- node scripts/generate-brand-icons.mjs"

[tasks."build:android"]
description = "Build the Android ARM64 APK; release signing must be configured"
run = "powershell -NoProfile -File scripts/atlas.ps1 build-android"

[tasks.exec]
description = "Run a one-off command with the same verified child-process PATH as tasks"
run = "powershell -NoProfile -File scripts/atlas.ps1 exec"

[tasks."contracts:generate"]
description = "Explicitly regenerate TypeScript from the shared Rust contracts"
run = "powershell -NoProfile -File scripts/atlas.ps1 contracts-generate"

[tasks."contracts:check"]
description = "Verify generated bindings without rewriting them"
run = "powershell -NoProfile -File scripts/atlas.ps1 contracts-check"

[tasks."check:android-core"]
description = "Compile the portable Rust/SQLite core for ARM64 using the configured NDK"
run = "powershell -NoProfile -File scripts/atlas.ps1 check-android-core"
