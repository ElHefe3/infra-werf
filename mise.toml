# Exact releases resolved on 2026-10-25. Upgrade deliberately between batches.
[tools]
node = "26.12.1"
pnpm = "12.15.0"
python = "3.15.1"
java = "temurin-21.0.12+101.0.LTS"
rust = { version = "1.99.1-x86_64-pc-windows-msvc", profile = "default", targets = ["aarch64-linux-android"] }

[env]
ATLAS_ANDROID_NDK_VERSION = "27.1.12297006"

[tasks.doctor]
description = "Inspect effective runtimes and native build prerequisites"
run = "powershell -NoProfile -File scripts/atlas.ps1 doctor"

[tasks.deps]
description = "Install the committed JavaScript dependency lock"
run = "powershell -NoProfile -File scripts/atlas.ps1 deps"

[tasks."tracker:check"]
description = "Validate roadmap, dependencies and evidence rules"
run = "powershell -NoProfile -File scripts/atlas.ps1 tracker-check"

[tasks.check]
description = "Check frontend types and native Rust code without rewriting"
run = "powershell -NoProfile -File scripts/atlas.ps1 check"

[tasks."test:feature"]
description = "Run the selected feature's bounded checks"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-feature"

[tasks."test:integration"]
description = "Run Python/Rust parity, rollback, writer-lock and import checks on private synthetic copies"
run = "powershell -NoProfile -File scripts/atlas.ps1 test-integration"

[tasks."dev:desktop"]
run = "powershell -NoProfile -File scripts/atlas.ps1 dev-desktop"

[tasks."dev:android"]
run = "powershell -NoProfile -File scripts/atlas.ps1 dev-android"

[tasks."smoke:desktop"]
description = "Compile the thin Windows debug application without an installer"
run = "powershell -NoProfile -File scripts/atlas.ps1 smoke-desktop"

[tasks."smoke:android"]
description = "Compile the thin ARM64 Android debug APK"
run = "powershell -NoProfile -File scripts/atlas.ps1 smoke-android"

[tasks."build:desktop"]
description = "Build the Windows NSIS installer"
run = "powershell -NoProfile -File scripts/atlas.ps1 build-desktop"

[tasks."build:android"]
description = "Build the Android ARM64 APK; release signing must be configured"
run = "powershell -NoProfile -File scripts/atlas.ps1 build-android"

[tasks.exec]
description = "Run a one-off command with the same verified child-process PATH as tasks"
run = "powershell -NoProfile -File scripts/atlas.ps1 exec"

[tasks."contracts:generate"]
description = "Explicitly regenerate TypeScript from the shared Rust contracts"
run = "powershell -NoProfile -File scripts/atlas.ps1 contracts-generate"

[tasks."contracts:check"]
description = "Verify generated bindings without rewriting them"
run = "powershell -NoProfile -File scripts/atlas.ps1 contracts-check"

[tasks."check:android-core"]
description = "Compile the portable Rust/SQLite core for ARM64 using the configured NDK"
run = "powershell -NoProfile -File scripts/atlas.ps1 check-android-core"
